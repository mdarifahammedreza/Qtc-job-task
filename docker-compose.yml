# QuickHire stack: backend + frontend
# Dev:  docker compose up --build
# Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#       Set MONGODB_URI, JWT_* and NEXT_PUBLIC_API_URL (public API URL) in .env

services:
  mongo:
    image: mongo:7
    container_name: quick-hire-mongo
    networks:
      - quickhire
    ports:
      - "2022:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 15s
      retries: 10
      start_period: 40s
    restart: always

  backend:
    build:
      context: ./quick-hire
      dockerfile: Dockerfile
    container_name: quick-hire-backend
    networks:
      - quickhire
    ports:
      - "3011:3000"
    volumes:
      - ./quick-hire:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/quick-hire}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-min-32-characters-long}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-different-from-access}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-7d}
    depends_on:
      mongo:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./quick-hire-app
      dockerfile: Dockerfile
    container_name: quick-hire-frontend
    networks:
      - quickhire
    ports:
      - "2020:3000"
    volumes:
      - ./quick-hire-app:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_URL: http://localhost:2021/api
    depends_on:
      - backend
    restart: always

networks:
  quickhire:
    driver: bridge

volumes:
  mongo_data:
